name: Build SaniTrack Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & sync Capacitor
        working-directory: ./Sani-Track-Android-main
        run: |
          npm install
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android Debug APK
        working-directory: ./Sani-Track-Android-main/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload SaniTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: SaniTrack-Staff-App
          path: Sani-Track-Android-main/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
