name: Build SaniTrack Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & sync Capacitor
        working-directory: ./Sani-Track-Android-main
        run: |
          npm install
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 Platform & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Android Debug APK
        working-directory: ./Sani-Track-Android-main/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          GRADLE_STATUS=${PIPESTATUS[0]}
          if [ $GRADLE_STATUS -ne 0 ]; then
            echo "## ❌ Android Build Error Output" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $GRADLE_STATUS
          fi
          mkdir -p "$GITHUB_WORKSPACE/output-apk"
          find . -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/output-apk/" \;

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: Sani-Track-Android-main/android/build.log

      - name: Upload SaniTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: SaniTrack-Staff-App
          path: output-apk/*.apk
          if-no-files-found: error
