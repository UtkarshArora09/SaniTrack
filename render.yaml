services:
  - type: web
    name: sanitrack
    env: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: SANITRACK_SECRET_KEY
        generateValue: true
      - key: SANITRACK_CONFIDENCE
        value: 0.5
      - key: SANITRACK_FACE_THRESHOLD
        value: 0.8
      - key: SANITRACK_DEBUG
        value: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: ADMIN_WHATSAPP_TO
        sync: false
